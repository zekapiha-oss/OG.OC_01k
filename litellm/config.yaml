# ============================================================
#  LiteLLM Gateway - OpenClaw + GCP budget $199
#  Project: gen-lang-client-0454675031
#  Start: litellm --config config.yaml --port 4000
# ============================================================
#
#  Credentials: set GOOGLE_APPLICATION_CREDENTIALS env variable
#  (already configured by check_all.ps1 / setup.ps1)
# ============================================================

model_list:

  # -- PRIMARY: Claude Sonnet 4.5 via Vertex AI (global) --
  - model_name: claude-sonnet
    litellm_params:
      model: vertex_ai/claude-sonnet-4-5@20250929
      vertex_project: "gen-lang-client-0454675031"
      vertex_location: "global"
      vertex_credentials: "os.environ/GOOGLE_APPLICATION_CREDENTIALS"

  - model_name: sonnet-4.5
    litellm_params:
      model: vertex_ai/claude-sonnet-4-5@20250929
      vertex_project: "gen-lang-client-0454675031"
      vertex_location: "global"
      vertex_credentials: "os.environ/GOOGLE_APPLICATION_CREDENTIALS"

  # -- FALLBACK: Gemini 1.5 Flash --
  - model_name: gemini-flash
    litellm_params:
      model: vertex_ai/gemini-1.5-flash
      vertex_project: "gen-lang-client-0454675031"
      vertex_location: "us-central1"
      vertex_credentials: "os.environ/GOOGLE_APPLICATION_CREDENTIALS"

# -- FALLBACK LOGIC --
router_settings:
  fallbacks:
    - claude-sonnet: ["gemini-flash"]
    - sonnet-4.5: ["gemini-flash"]
  num_retries: 3
  retry_after: 5

# -- BUDGET --
litellm_settings:
  max_budget: 199.00
  budget_duration: "3mo"
  set_verbose: false
  drop_params: true

# -- SERVER --
general_settings:
  master_key: "sk-openclaw-local"
