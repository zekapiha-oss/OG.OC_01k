model_list:

  # ── ОСНОВНАЯ МОДЕЛЬ: Claude Sonnet 4.5 через Vertex AI ────
  # Алиас "claude-sonnet" — для совместимости с OpenClaw / другими клиентами
  - model_name: claude-sonnet
    litellm_params:
      model: vertex_ai/claude-sonnet-4-5@20250514
      vertex_project: "gen-lang-client-0454675031"
      vertex_location: "us-east5"
      vertex_credentials: "C:\\Users\\Евгений\\OneDrive\\Документи\\kovalenko_ev\\gen-lang-client-0454675031-a92bf51ffd4a.json"

  # То же, под именем sonnet-4.5 (для прямых вызовов)
  - model_name: sonnet-4.5
    litellm_params:
      model: vertex_ai/claude-sonnet-4-5@20250514
      vertex_project: "gen-lang-client-0454675031"
      vertex_location: "us-east5"
      vertex_credentials: "C:\\Users\\Евгений\\OneDrive\\Документи\\kovalenko_ev\\gen-lang-client-0454675031-a92bf51ffd4a.json"

  # ── ФОЛЛБЭК: Gemini 2.0 Flash (бесплатные квоты GCP, всегда доступен) ──
  - model_name: gemini-flash
    litellm_params:
      model: vertex_ai/gemini-2.0-flash-001
      vertex_project: "gen-lang-client-0454675031"
      vertex_location: "us-central1"
      vertex_credentials: "C:\\Users\\Евгений\\OneDrive\\Документи\\kovalenko_ev\\gen-lang-client-0454675031-a92bf51ffd4a.json"

# ── ЛОГИКА ФОЛЛБЭКА ─────────────────────────────────────────
router_settings:
  # При ошибке / превышении квоты claude-sonnet → gemini-flash
  fallbacks:
    - claude-sonnet: ["gemini-flash"]
    - sonnet-4.5: ["gemini-flash"]

  # Повторные попытки при временных ошибках
  num_retries: 3
  retry_after: 5

# ── БЮДЖЕТ ──────────────────────────────────────────────────
litellm_settings:
  # Жёсткий лимит: $199 на 3 месяца (до конца мая 2026)
  max_budget: 199.00
  budget_duration: "3mo"

  # Логирование (опционально, для отладки)
  set_verbose: false
  drop_params: true      # игнорировать неподдерживаемые параметры

# ── СЕРВЕР ──────────────────────────────────────────────────
general_settings:
  master_key: "sk-openclaw-local"   # OpenClaw должен использовать этот ключ
  # Разрешаем только локальные подключения
  # host: "127.0.0.1"   # раскомментировать для жёсткой блокировки внешних
